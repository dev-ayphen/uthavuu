services:
  postgres:
    image: postgres:16-alpine
    container_name: uthavu-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: uthavu
      POSTGRES_PASSWORD: uthavu
      POSTGRES_DB: uthavu_dev
    ports:
      # Host 5433, not 5432 — this machine already runs other projects' Postgres
      # natively on 5432. Don't change without checking for a real conflict first.
      - '5433:5432'
    volumes:
      - uthavu_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U uthavu -d uthavu_dev']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: uthavu-redis
    restart: unless-stopped
    ports:
      # Host 6380, not 6379 — same reason as above.
      - '6380:6379'
    volumes:
      - uthavu_redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: uthavu-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Reuses apps/api/.env for BETTER_AUTH_SECRET/BETTER_AUTH_URL/PORT/msg91 —
    # only the two networking values below need to differ (container-to-container
    # DNS names + internal ports, not the host-mapped 5433/6380).
    env_file:
      - ./apps/api/.env
    environment:
      DATABASE_URL: postgres://uthavu:uthavu@postgres:5432/uthavu_dev
      REDIS_URL: redis://redis:6379
    ports:
      - '3001:3001'
    volumes:
      - uthavu_api_uploads:/repo/apps/api/uploads
      # Quarantine needs a volume as much as the public directory does, and for a
      # sharper reason. Without this it lives on the container's writable layer,
      # so every `docker compose build` + recreate DESTROYS every photo awaiting
      # moderation while their `photo_uploads` rows survive — a queue full of
      # items a moderator cannot view and cannot approve (`publishIfReady` throws
      # "has no file to publish"). Observed live: 30 held rows, 3 files on disk.
      #
      # It is a SEPARATE volume, not a subdirectory of the public one, because
      # `quarantine-storage.ts` refuses to boot if QUARANTINE_DIR resolves inside
      # UPLOADS_DIR — anything under UPLOADS_DIR is served by the static
      # middleware, which would publish the very photos this directory hides.
      - uthavu_api_quarantine:/repo/apps/api/uploads-pending

volumes:
  uthavu_postgres_data:
  uthavu_redis_data:
  uthavu_api_uploads:
  uthavu_api_quarantine:
