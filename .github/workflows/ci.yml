name: CI

# Add `develop` alongside `main` if you run a staging branch:
#   branches: [main, develop]
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref — a new push makes the previous run moot.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.25.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check api
        run: pnpm --filter api type-check

      - name: Type check admin app
        run: pnpm --filter admin type-check

  test:
    name: Tests
    runs-on: ubuntu-latest

    # The API suite talks to REAL backing services — every service spec inserts
    # rows and reads them back, and `db` and `redis` are both module-level
    # connections built from env at import. There is nothing in-memory or mocked
    # to fall back on, so a missing service does not skip a test, it hangs one.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: uthavu_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5

      # Redis is NOT optional here, and its absence is invisible in the failure.
      # `otp-rate-limiter.spec.ts` keys the OTP send/verify limits in Redis; with
      # no server, `redis.del()` in its afterEach simply never resolves and all 8
      # tests die on Jest's 5s timeout with "Exceeded timeout", naming the hook
      # rather than the missing dependency. Cost us one red build to read.
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s
          --health-timeout 5s --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/uthavu_test
      # 6379, unlike docker-compose's host mapping of 6380 — that offset exists
      # to avoid colliding with a developer's local Redis, and a CI runner has
      # no such collision to avoid.
      REDIS_URL: redis://localhost:6379
      # Better Auth refuses to construct without a secret. CI-only value; it
      # signs nothing that outlives the job.
      BETTER_AUTH_SECRET: ci-not-a-real-secret-000000000000
      BETTER_AUTH_URL: http://localhost:3001
      # The seed creates the two admin accounts and needs their passwords.
      SEED_ADMIN_PASSWORD: ci-admin-password
      SEED_OPS_PASSWORD: ci-ops-password

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.25.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Migrations, then seed: the specs read lookup rows (report statuses,
      # categories, ticket statuses, user statuses) that only the seed writes.
      # A migrated-but-unseeded database fails on foreign keys, not assertions.
      - name: Prepare test database
        run: pnpm db:migrate && pnpm db:seed

      - name: Run backend tests
        run: pnpm test:api

      # Restored alongside the console's first tests (Vitest, node env). It
      # needs no database: what it covers is decision logic — the sidebar's
      # fail-closed permission gating, what an API refusal code means to an
      # operator, and which placements actually reach a phone.
      - name: Run admin tests
        run: pnpm test:admin

  build:
    name: Build
    runs-on: ubuntu-latest
    # Build only after lint + tests pass — fail fast on the cheap checks first.
    needs: [lint-typecheck, test]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.25.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm build

  # ── E2E ──────────────────────────────────────────────────────────────────
  # Testing profile is `full` — Playwright drives the critical journeys (OTP
  # login, report, accept/volunteer, complete mission) against a built app +
  # a real Postgres. Mobile E2E (Maestro) runs separately via EAS Workflows,
  # not here — see .eas/workflows once the mobile app is scaffolded.
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: [build]

    # DISABLED UNTIL PLAYWRIGHT ACTUALLY EXISTS.
    #
    # The App Profile sets testing to `full` and names Playwright on the four
    # critical journeys, but there is no `playwright.config.*` anywhere in this
    # repo and no root `test:e2e` script — so every step below fails. The job is
    # kept rather than deleted because the intent is real and the wiring here is
    # correct; flip this to `true` in the commit that adds the config, the
    # script and the first journey spec.
    if: false
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.25.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm db:migrate && pnpm db:seed
      - run: pnpm test:e2e            # boots the app + runs the critical journeys
